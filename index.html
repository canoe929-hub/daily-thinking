<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日思考</title>
<style>
:root{--bg:#faf9f6;--fg:#222;--mu:#777;--c:#fff;--bd:#e3e0d8;--ac:#3f5be0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#e8e8ea;--mu:#9a9aa0;--c:#202024;--bd:#33333a;--ac:#8aa0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#e8e8ea;--mu:#9a9aa0;--c:#202024;--bd:#33333a;--ac:#8aa0ff;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:20px;margin:4px 0}.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
.sec{font-weight:700;margin:20px 0 8px;color:var(--ac)}
.card{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mu);margin:2px 0 4px}
.fw{display:flex;gap:6px;margin-bottom:8px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:8px}
textarea{min-height:60px;resize:vertical}
.mic{flex:0 0 40px;border:1px solid var(--bd);border-radius:8px;background:transparent;font-size:18px;cursor:pointer}.mic.on{background:var(--ac)}
.chip{border:1px solid var(--bd);border-radius:999px;padding:4px 12px;font-size:13px;background:transparent;color:var(--fg);cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.lens{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--c);border:1px dashed var(--ac);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:14px}
.lens b{color:var(--ac)}
.btn{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:6px}
.btn.s{background:transparent;color:var(--ac)}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}.row input[type=checkbox]{width:22px;height:22px;flex:0 0 22px;accent-color:var(--ac)}
.row small{color:var(--mu);font-size:11px;flex:0 0 38px}.x{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}
#msg{color:var(--mu);font-size:13px;min-height:20px;margin-top:10px}
</style></head><body><main>
<h1>每日思考</h1><div class="sub" id="d"></div>

<div class="sec">#Idea · 金句 → 我的思考</div>
<div class="lens"><div><b id="ln"></b> <span id="lq"></span></div><button class="chip" id="lx">換一個</button></div>
<div id="cards"></div>
<button class="btn s" id="ac">＋ 再加一則</button>
<button class="btn" id="ci">複製 → #Idea</button>

<div class="sec">#Memo · 先流水記錄,再過篩</div>
<div class="fw"><input type="text" id="mi" placeholder="想到就丟進來,按 Enter 加入"><button class="mic" id="mm">🎤</button></div>
<div id="list"></div>
<button class="btn" id="cm">複製勾選的 → #Memo</button>
<button class="btn s" id="cl">清空今天</button>
<div id="msg">貼上前,先點進 daily note 該區的空白項目(- 或 1.)</div>
</main>
<script>
const L=[["逆向思考","要怎麼做才會確定失敗?把它反過來。"],["能力圈","這在我的能力圈內嗎?邊界在哪?"],["二階效應","然後呢?再然後呢?"],["激勵機制","誰被什麼激勵?結果就是這樣來的。"],["跨領域類比","生物、物理或心理學會怎麼解釋它?"],["反脆弱","這讓我更強,還是更脆弱?"],["機會成本","選這個,我放棄了什麼?"],["時間複利","十年後這還重要嗎?"],["誤判心理","哪個偏誤正在影響我的判斷?"]];
const day=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
document.getElementById("d").textContent=day;
let S={cards:[{q:"",th:"",lens:""}],memos:[],li:Math.floor(Date.now()/864e5)%L.length};
try{const x=JSON.parse(localStorage.getItem("dt2:"+day)||"null");if(x)S=x}catch(e){}
const save=()=>{try{localStorage.setItem("dt2:"+day,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),m=$("msg"),say=t=>m.textContent=t;
function mic(b,el){b.onclick=()=>{el.focus();say("鍵盤已叫出,點鍵盤右下角的 🎤 開始講話")}}
function lens(){$("ln").textContent=L[S.li][0]+":";$("lq").textContent=L[S.li][1]}
$("lx").onclick=()=>{S.li=(S.li+1)%L.length;lens();save()};lens();
function ta(c,k,lab,ph){
 const w=document.createElement("div");w.innerHTML=`<label>${lab}</label>`;
 const r=document.createElement("div");r.className="fw";
 const i=document.createElement("textarea");i.placeholder=ph;i.value=c[k];i.oninput=()=>{c[k]=i.value;save()};
 const b=document.createElement("button");b.className="mic";b.textContent="🎤";
 mic(b,i);
 r.append(i,b);w.appendChild(r);return w}
function cards(){const box=$("cards");box.innerHTML="";
 S.cards.forEach((c,n)=>{const d=document.createElement("div");d.className="card";
  d.append(ta(c,"q","💬 看到的一段話 / 金句","貼上網路對話或書中的一句話"),ta(c,"th","🧠 我的思考","它讓我想到什麼?跟哪個領域有關?"));
  const b=document.createElement("button");b.className="chip"+(c.lens?" on":"");b.textContent="🔎 用了今日鏡頭";
  b.onclick=()=>{c.lens=c.lens?"":L[S.li][0];b.classList.toggle("on",!!c.lens);save()};d.appendChild(b);
  if(S.cards.length>1){const x=document.createElement("button");x.className="x";x.textContent="✕";x.onclick=()=>{S.cards.splice(n,1);save();cards()};d.appendChild(x)}
  box.appendChild(d)})}
$("ac").onclick=()=>{S.cards.push({q:"",th:"",lens:""});save();cards()};cards();
function list(){const box=$("list");box.innerHTML="";
 S.memos.forEach((o,n)=>{const r=document.createElement("div");r.className="row";
  r.innerHTML=`<input type="checkbox" ${o.keep?"checked":""}><small>${o.t}</small>`;
  r.firstChild.onchange=e=>{o.keep=e.target.checked;save()};
  const i=document.createElement("input");i.type="text";i.value=o.text;i.oninput=()=>{o.text=i.value;save()};
  const x=document.createElement("button");x.className="x";x.textContent="✕";x.onclick=()=>{S.memos.splice(n,1);save();list()};
  r.append(i,x);box.appendChild(r)})}
const mi=$("mi");
function add(){const v=mi.value.trim();if(!v)return;const n=new Date();
 S.memos.push({t:String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"),text:v,keep:true});mi.value="";save();list()}
mi.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add()}};
mi.onblur=add;
mic($("mm"),mi);list();
const one=s=>(s||"").trim().replace(/\s*\n\s*/g," ");
function idea(){return S.cards.map(c=>{const q=one(c.q),th=one(c.th),a=[];
 if(q)a.push("💬 "+q);
 if(th){const s="🧠 "+(c.lens?"[["+c.lens+"]] ":"")+th;a.push(q?"\t- "+s:s)}
 return a.join("\n")}).filter(Boolean).join("\n- ")}
function memo(){return S.memos.filter(o=>o.keep&&o.text.trim()).map((o,i)=>i?(i+1)+". "+one(o.text):one(o.text)).join("\n")}
const cp=async s=>{try{await navigator.clipboard.writeText(s)}catch(e){const t=document.createElement("textarea");t.value=s;document.body.appendChild(t);t.select();const ok=document.execCommand("copy");t.remove();if(!ok)throw e}};
const cpy=async(s,n)=>{add();if(!s){say("這一區還沒有內容");return}
 try{await cp(s);say("已複製,貼到 #"+n+" 的空白項目")}catch(e){say("複製失敗,請重試")}};
$("ci").onclick=()=>cpy(idea(),"Idea");
$("cm").onclick=()=>cpy(memo(),"Memo");
$("cl").onclick=()=>{S={cards:[{q:"",th:"",lens:""}],memos:[],li:S.li};save();cards();list()};
</script></body></html>
